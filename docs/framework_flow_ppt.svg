<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .step { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .title { font-size: 25px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 17px; fill: #475569; }
      .small { font-size: 15px; fill: #64748b; }
      .feature-title { font-size: 18px; font-weight: 700; fill: #14532d; }
      .feature-text { font-size: 14px; fill: #166534; }
    </style>
  </defs>

  <rect width="1600" height="560" fill="#f8fafc"/>
  <circle cx="1535" cy="20" r="190" fill="#dbeafe" opacity="0.48"/>
  <circle cx="15" cy="555" r="170" fill="#dcfce7" opacity="0.35"/>

  <!-- Main flow arrows -->
  <path d="M235 280 H278" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M495 280 H538" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M765 280 H808" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1095 280 H1138" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1355 280 H1398" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="25" y="105" width="210" height="350" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
    <rect x="47" y="80" width="82" height="38" rx="19" fill="#2563eb"/>
  </g>
  <text x="88" y="106" text-anchor="middle" class="font step">步骤 1</text>
  <text x="130" y="182" text-anchor="middle" class="font title">输入准备与契约</text>
  <text x="130" y="237" text-anchor="middle" class="font text">读取任务与输入文件</text>
  <text x="130" y="275" text-anchor="middle" class="font text">生成文件预览</text>
  <text x="130" y="313" text-anchor="middle" class="font text">完成任务分类</text>
  <rect x="48" y="353" width="164" height="56" rx="14" fill="#eff6ff"/>
  <text x="130" y="376" text-anchor="middle" class="font small">Python 生成并冻结</text>
  <text x="130" y="398" text-anchor="middle" class="font text">TaskSpec</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="285" y="105" width="210" height="350" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
    <rect x="307" y="80" width="82" height="38" rx="19" fill="#7c3aed"/>
  </g>
  <text x="348" y="106" text-anchor="middle" class="font step">步骤 2</text>
  <text x="390" y="182" text-anchor="middle" class="font title">任务语义理解</text>
  <text x="390" y="237" text-anchor="middle" class="font text">提炼目标与约束</text>
  <text x="390" y="275" text-anchor="middle" class="font text">识别歧义与风险</text>
  <text x="390" y="313" text-anchor="middle" class="font text">建议所需能力</text>
  <rect x="308" y="353" width="164" height="56" rx="14" fill="#f5f3ff"/>
  <text x="390" y="387" text-anchor="middle" class="font small">TaskUnderstandingAgent</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="545" y="105" width="220" height="350" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
    <rect x="567" y="80" width="82" height="38" rx="19" fill="#7c3aed"/>
  </g>
  <text x="608" y="106" text-anchor="middle" class="font step">步骤 3</text>
  <text x="655" y="182" text-anchor="middle" class="font title">生成动态 DAG</text>
  <text x="655" y="237" text-anchor="middle" class="font text">规划任务节点</text>
  <text x="655" y="275" text-anchor="middle" class="font text">建立依赖关系</text>
  <text x="655" y="313" text-anchor="middle" class="font text">声明能力与产物</text>
  <rect x="568" y="343" width="174" height="76" rx="14" fill="#f5f3ff"/>
  <text x="655" y="368" text-anchor="middle" class="font small">PlanningAgent 生成</text>
  <text x="655" y="397" text-anchor="middle" class="font small">Python 校验 DAG</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="815" y="70" width="280" height="420" rx="24" fill="#ffffff" stroke="#4ade80" stroke-width="4"/>
    <rect x="837" y="45" width="82" height="38" rx="19" fill="#16a34a"/>
  </g>
  <text x="878" y="71" text-anchor="middle" class="font step">步骤 4</text>
  <text x="955" y="135" text-anchor="middle" class="font title">动态路由与执行</text>
  <text x="955" y="174" text-anchor="middle" class="font text">按节点能力选择执行者</text>

  <rect x="840" y="205" width="230" height="68" rx="15" fill="#dcfce7"/>
  <text x="955" y="231" text-anchor="middle" class="font feature-title">AgentPrune-lite</text>
  <text x="955" y="255" text-anchor="middle" class="font feature-text">稀疏路由 · 裁剪冗余通信</text>

  <rect x="840" y="287" width="230" height="68" rx="15" fill="#dcfce7"/>
  <text x="955" y="313" text-anchor="middle" class="font feature-title">LLMLingua</text>
  <text x="955" y="337" text-anchor="middle" class="font feature-text">上下文压缩 · Token 预算控制</text>

  <rect x="840" y="369" width="230" height="68" rx="15" fill="#dcfce7"/>
  <text x="955" y="395" text-anchor="middle" class="font feature-title">DyLAN-lite</text>
  <text x="955" y="419" text-anchor="middle" class="font feature-text">依据质量与成本动态选择 Agent</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="1145" y="105" width="210" height="350" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
    <rect x="1167" y="80" width="82" height="38" rx="19" fill="#7c3aed"/>
  </g>
  <text x="1208" y="106" text-anchor="middle" class="font step">步骤 5</text>
  <text x="1250" y="182" text-anchor="middle" class="font title">审查与报告</text>
  <text x="1250" y="230" text-anchor="middle" class="font text">EvidenceVerifier</text>
  <text x="1250" y="263" text-anchor="middle" class="font small">核验事实与证据</text>
  <text x="1250" y="310" text-anchor="middle" class="font text">ReviewAgent</text>
  <text x="1250" y="343" text-anchor="middle" class="font small">报告前语义审查</text>
  <rect x="1168" y="370" width="164" height="48" rx="14" fill="#f5f3ff"/>
  <text x="1250" y="400" text-anchor="middle" class="font small">ReportAgent 仅调用一次</text>

  <!-- Step 6 -->
  <g filter="url(#shadow)">
    <rect x="1405" y="105" width="170" height="350" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
    <rect x="1427" y="80" width="82" height="38" rx="19" fill="#2563eb"/>
  </g>
  <text x="1468" y="106" text-anchor="middle" class="font step">步骤 6</text>
  <text x="1490" y="182" text-anchor="middle" class="font title">最终验收</text>
  <text x="1490" y="237" text-anchor="middle" class="font text">检查必需产物</text>
  <text x="1490" y="275" text-anchor="middle" class="font text">验证报告内容</text>
  <text x="1490" y="313" text-anchor="middle" class="font text">更新 RunState</text>
  <rect x="1427" y="353" width="126" height="56" rx="14" fill="#eff6ff"/>
  <text x="1490" y="376" text-anchor="middle" class="font small">沉淀工作流</text>
  <text x="1490" y="398" text-anchor="middle" class="font small">Memory</text>
</svg>
