services:
  demo:
    build:
      context: ./system_source
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEMO_PORT:-8765}:8765"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./system_source/outputs:/app/outputs
      - ./system_source/memory:/app/memory
    restart: unless-stopped
  live:
    profiles: [live]
    build:
      context: ./system_source
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEMO_PORT:-8765}:8765"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./system_source/outputs:/app/outputs
      - ./system_source/memory:/app/memory
    command: ["python", "-u", "utils/dashboard_server.py", "--host", "0.0.0.0", "--port", "8765", "--enable-execution"]
